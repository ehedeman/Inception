version: "3.7"

services:
  nginx:
    build: requirements/nginx/.
    container_name: nginx
    depends_on:
     - wordpress
     - mariadb
    # ports:
    #   - "80:80"
    ports:
      - "443:443"
    volumes:
     - ./web:/var/www/html
    restart: on-failure
    networks:
     - inception
  wordpress:
    build: requirements/wordpress/.
    container_name: wp-php
    depends_on:
     - mariadb
    volumes:
     - ./web:/var/www/html
    restart: on-failure
    networks:
     - inception
    # expose:
    #  - "9000"
  mariadb:
    build: requirements/mariadb/.
    container_name: mariadb
    # volumes:
    #   - ./database:/var/lib/mysql
    restart: on-failure
    networks:
     - inception
    # expose:
    #  - "3306"
networks:
  inception:
