services:
  nginx:
    build: requirements/nginx/.
    container_name: nginx
    ports:
      - "443:443"
    volumes:
     - wordpress_db:/var/www/html
    depends_on:
     - wordpress
    networks:
     - inception
    env_file:
     - .env
    restart:
      on-failure
  wordpress:
    build: requirements/wordpress/.
    container_name: wp-php
    volumes:
     - wordpress_db:/var/www/html
    depends_on:
     - mariadb
    networks:
     - inception
    env_file:
     - .env
    restart:
      on-failure
  mariadb:
    build: requirements/mariadb/.
    container_name: mariadb
    volumes:
     - mariadb_db:/var/lib/mysql
    networks:
     - inception
    env_file:
     - .env
    restart:
      on-failure

networks:
  inception:
    name: inception

volumes:
  mariadb_db:
    driver_opts:
      type: 'none'
      o: bind
      device: /home/marlon/data/Inception_database
  wordpress_db:
    driver_opts:
      type: 'none'
      o: bind
      device: /home/marlon/data/Inception_web