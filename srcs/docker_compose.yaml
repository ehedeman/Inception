version: "3.5"

networks:
  Inception:
    name: Inception

services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx/.
    image: nginx:42
    ports:
     - "443:443"
    depends_on:
      - wordpress
    volumes:
      - /Users/marlon/Desktop/Inception/srcs/wordpress:/var/www/html
    networks:
      - Inception
    env_file:
      - .env
    restart: always
  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress/.
    image: wordpress:42
    depends_on:
      - mariadb
    volumes:
      - /Users/marlon/Desktop/Inception/srcs/wordpress:/var/www/html
    env_file:
      - .env
    networks:
      - Inception
    restart: always
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb/.
    image: mariadb:42
    volumes:
      - /Users/marlon/Desktop/Inception/srcs/mariadb:/var/lib/mysql
    env_file:
      - .env
    networks:
      - Inception
    restart: always
